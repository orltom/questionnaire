name: Back-end

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/openapi.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'api/openapi.yaml'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Generate
        run: task check

      - name: Verify generated sources are up to date
        run: git diff --exit-code

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build
        run: task build

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: backend/bin/server
          retention-days: 7
